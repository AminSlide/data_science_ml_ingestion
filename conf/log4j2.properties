# Journal de Spark pour ce projet (lu via SPARK_CONF_DIR, voir src/spark_session.py) :
# on garde les avertissements, sans le bruit habituel du démarrage.
rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n%ex

# Bibliothèques natives de Hadoop absentes sous macOS et Windows : sans conséquence en local.
logger.nativecodeloader.name = org.apache.hadoop.util.NativeCodeLoader
logger.nativecodeloader.level = error
